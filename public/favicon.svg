  <!-- Cat ears -->
  <polygon points="9,9 7,4 12,8" fill="#1E4011"/>
  <polygon points="23,9 25,4 20,8" fill="#1E4011"/>
  <!-- Ear inner -->
  <polygon points="9.5,8.5 8,5 12,7.5" fill="#F4907A" opacity="0.7"/>
  <polygon points="22.5,8.5 24,5 20,7.5" fill="#F4907A" opacity="0.7"/>
</svg>
